<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="popup.css"/>
    <title>hide letterboxd ratings and reviews</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
<h1>hide letterboxd ratings and reviews</h1>

<div class="settings-container">
    <div id="reviews-page-info" hidden>
        Only short reviews can be hidden on reviews page. Your saved settings are unchanged.
    </div>
    <div>
        <div class="setting-section">
            <input type="checkbox" id="hide-ratings-checkbox" name="hide-ratings-checkbox" value="yes">
            <label for="hide-ratings-checkbox">hide ratings</label>
        </div>
        <br>
        <div>
            <div class="setting-section">
                <input type="checkbox" id="hide-reviews-checkbox" name="hide-reviews-checkbox" value="yes">
                <label for="hide-reviews-checkbox">hide reviews</label>
            </div>
            <div class="review-options">
                <div class="setting-section">
                    <input type="radio" id="hide-all-reviews-radio"
                           name="hide-reviews-option" value="all">
                    <label for="hide-all-reviews-radio">all</label>
                </div>

                <div class="setting-section">
                    <input type="radio" id="hide-short-reviews-radio"
                           name="hide-reviews-option" value="short">
                    <label for="hide-short-reviews-radio">below 100 characters</label>
                </div>
            </div>
        </div>
    </div>
    <div>
        <div class="setting-section">
            <input type="checkbox" id="show-logged-checkbox" name="show-logged-checkbox" value="no">
            <label for="show-logged-checkbox">show for logged films</label>
        </div>
    </div>
</div>
<script src="../shared/utils.js"></script>
<script src="../shared/settings.js"></script>
<script src="popup.js"></script>
</body>

</html>
